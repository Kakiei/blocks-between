*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#28304a,#10131d 54%);color:#f3f5ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;user-select:none}.app{width:min(100%,700px)}header{display:flex;justify-content:space-between;align-items:center;margin:0 auto 18px}.brand{display:flex;align-items:center;gap:12px}.logo{color:#a6f05b;font-size:30px}.brand h1{font-size:17px;letter-spacing:.12em;margin:0}.brand p{font-size:11px;color:#8991a8;margin:4px 0 0}.actions{display:flex;gap:8px}button{font:inherit;color:inherit;cursor:pointer}.icon,.secondary,.ctl{border:1px solid #ffffff20;background:#ffffff08;border-radius:12px}.icon{width:42px;height:42px;font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}.shell{position:relative;padding:9px;border:1px solid #ffffff20;border-radius:17px;background:#ffffff08;box-shadow:0 24px 80px #0005}.wrap{position:relative;aspect-ratio:1/2;max-height:min(74vh,680px)}canvas{display:block;width:100%;height:100%;border-radius:9px;background:#111621}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#10131dcc;border-radius:9px;text-align:center;padding:20px}.overlay.off{display:none}.overlay h2{font-size:24px;margin:0 0 8px}.overlay p{font-size:13px;color:#a7aec2;line-height:1.7}.primary{background:#a6f05b;color:#17200e;border:0;border-radius:12px;padding:12px 24px;font-weight:750}.side{display:flex;flex-direction:column;gap:10px}.card{background:#1b2130;border:1px solid #ffffff16;border-radius:14px;padding:14px}.label{font-size:10px;color:#8991a8;letter-spacing:.12em;font-weight:700}.score{font-size:26px;font-weight:750;margin-top:6px;font-variant-numeric:tabular-nums}.row{display:flex;justify-content:space-between;margin-top:12px}.small{font-size:17px;font-weight:700;margin-top:3px}.prev{height:75px;display:flex;align-ite </style></head><body><main class="app"><header><div class="brand"><div class="logo">▦</div><div><h1>方块之间</h1><p>给思绪一点落点</p></div></div><div class="actions"><button class="icon" id="sound" title="音效">♫</button><button class="icon" id="pause">Ⅱ</button></div></header><section class="layout"><div class="shell"><div class="wrap"><canvas id="board"></canvas><div class="overlay" id="overlay"><div><h2 id="ot">准备好了吗？</h2><p id="op">让方块落在恰好的位置。<br>消除整行，继续前进。</p><button class="primary" id="start">开始游戏</button></div></div></div></div><aside class="side"><div class="card"><div class="label">得分</div><div class="score" id="score">000000</div><div class="row"><div><div class="label">等级</div><div class="small" id="level">01</div></div><div><div class="label">消除行</div><div class="small" id="lines">00</div></div></div></div><div class="card"><div class="label">下一个</div><div class="prev"><canvas id="next"></canvas></div></div><button class="secondary" id="restart">↻　重新开始</button><div class="hint">键盘操作<br>← → 移动　↑ 旋转<br>↓ 加速　空格 硬降<br>P 暂停</div></aside></section><nav class="controls"><button class="ctl" data-a="left">←</button><button class="ctl" data-a="rotate">↻</button><button class="ctl" data-a="right">→</button><button class="ctl" data-a="down">↓</button><button class="ctl drop" data-a="drop">⬇</button></nav></main>
<script>(()=>{const C=10,R=20,colors={I:'#63d9e8',O:'#f6d365',T:'#b49aff',S:'#8be28d',Z:'#ff7e91',J:'#7298ff',L:'#ffad68'},shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},bc=document.getElementById('board'),ctx=bc.getContext('2d'),nc=document.getElementById('next'),nx=nc.getContext('2d'),$=id=>document.getElementById(id);let grid,piece,next,score=0,lines=0,level=1,running=false,paused=false,last=0,timer=0,sound=true;function resize(){let d=Math.min(devicePixelRatio||1,2),r=bc.getBoundingClientRect();bc.width=r.width*d;bc.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw();drawNext()}function type(){return Object.keys(shapes)[Math.random()*7|0]}function make(t){let m=shapes[t].map(r=>r.slice());return{t,m,x:Math.floor((C-m[0].length)/2),y:0}}function hit(p){for(let y=0;y<p.m.length;y++)for(let x=0;x<p.m[y].length;x++)if(p.m[y][x]){let a=p.x+x,b=p.y+y;if(a<0||a>=C||b>=R||(b>=0&&grid[b][a]))return true}return false}function begin(){grid=Array.from({length:R},()=>Array(C).fill(''));score=0;lines=0;level=1;next=type();piece=make(type());running=true;paused=false;timer=0;last=0;update();drawNext();$('overlay').classList.add('off');$('pause').textContent='Ⅱ';beep(520,.07);cancelAnimationFrame(frame);frame=requestAnimationFrame(loop)}function update(){ $('score').textContent=String(score).padStart(6,'0');$('level').textContent=String(level).padStart(2,'0');$('lines').textContent=String(lines).padStart(2,'0')}function settle(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.t}));let n=0;for(let y=R-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(C).fill(''));n++;y++}if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=1+(lines/10|0);beep(480,.09)}piece=make(next);next=type();drawNext();update();if(hit(piece)){beep(140,.2);running=false;$('ot').textContent='这局很精彩';$('op').innerHTML='得分 '+String(score).padStart(6,'0')+'<br>再来一局，刷新纪录吧。';$('start').textContent='再玩一次';$('overlay').classList.remove('off')}}function move(dx,dy){if(!running||paused)return false;let q={...piece,x:piece.x+dx,y:piece.y+dy};if(!hit(q)){piece=q;draw();beep(dx?310:360,.025);return true}if(dy)settle();return false}function rotate(){if(!running||paused)return;let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse()),q={...piece,m};for(let k of [0,-1,1,-2,2]){let p={...q,x:q.x+k};if(!hit(p)){piece=p;draw();beep(260,.035);return}}}function drop(){if(!running||paused)return;let n=0;while(!hit({...piece,y:piece.y+1})){piece.y++;n++}score+=2*n;beep(180,.07);settle();update();draw()}function act(a){if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='down'&&move(0,1)){score++;update()}if(a==='rotate')rotate();if(a==='drop')drop()}function cell(c,x,y,s,ghost){let p=Math.max(1.5,s*.055);ctx.fillStyle=ghost?c+'70':c;ctx.fillRect(x*s+p,y*s+p,s-2*p,s-2*p);if(!ghost){ctx.fillStyle='#ffffff32';ctx.fillRect(x*s+2*p,y*s+2*p,s-4*p,Math.max(1,s*.07))}}function draw(){if(!ctx||!bc.width)return;let w=bc.clientWidth,h=bc.clientHeight,s=Math.min(w/C,h/R);ctx.clearRect(0,0,w,h);ctx.fillStyle='#111621';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff09';for(let x=0;x<=C;x++){ctx.beginPath();ctx.moveTo(x*s,0);ctx.lineTo(x*s,R*s);ctx.stroke()}for(let y=0;y<=R;y++){ctx.beginPath();ctx.moveTo(0,y*s);ctx.lineTo(C*s,y*s);ctx.stroke()}if(grid)grid.forEach((r,y)=>r.forEach((v,x)=>v&&cell(colors[v],x,y,s)));if(piece){let gy=piece.y;while(!hit({...piece,y:gy+1}))gy++;piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){cell(colors[piece.t],piece.x+x,gy+y,s,true);cell(colors[piece.t],piece.x+x,piece.y+y,s,false)}}))}}function drawNext(){let d=Math.min(devicePixelRatio||1,2),r=nc.getBoundingClientRect();nc.width=r.width*d;nc.height=r.height*d;nx.setTransform(d,0,0,d,0,0);nx.clearRect(0,0,r.width,r.height);if(!next)return;let m=shapes[next],s=Math.min(20,r.width/(m[0].length+1),r.height/(m.length+1)),ox=(r.width-m[0].length*s)/2,oy=(r.height-m.length*s)/2;nx.fillStyle=colors[next];m.forEach((row,y)=>row.forEach((v,x)=>{if(v)nx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2)}))}function beep(f,d){if(!sound)return;try{let a=beep.ctx||(beep.ctx=new(window.AudioContext||window.webkitAudioContext)());if(a.state==='suspended')a.resume();let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.025,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch{}}function loop(t){if(!running||paused)return;timer+=t-last;last=t;if(timer>Math.max(90,750-(level-1)*55)){timer=0;move(0,1)}draw();frame=requestAnimationFrame(loop)}let frame;function toggle(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';beep(paused?220:420,.06);if(paused){$('ot').textContent='休息一下';$('op').textContent='准备好了就继续。';$('start').textContent='继续游戏';$('overlay').classList.remove('off')}else{$('overlay').classList.add('off');last=0;frame=requestAnimationFrame(loop)}}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')act('left');else if(e.key==='ArrowRight'||e.key==='d')act('right');else if(e.key==='ArrowDown'||e.key==='s')act('down');else if(e.key==='ArrowUp'||e.key==='w')act('rotate');else if(e.key===' ')drop();else if(e.key.toLowerCase()==='p'||e.key==='Escape')toggle();else if(e.key==='Enter'&&!running)begin()});$('start').onclick=()=>paused?toggle():begin();$('restart').onclick=begin;$('pause').onclick=toggle;$('sound').onclick=()=>{sound=!sound;$('sound').style.opacity=sound?'1':'.45'};document.querySelectorAll('.ctl').forEach(b=>{let tm,a=b.dataset.a,fire=()=>act(a);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);fire();if(['left','right','down'].includes(a))tm=setInterval(fire,135)});['pointerup','pointercancel','lostpointercapture'].forEach(k=>b.addEventListener(k,()=>clearInterval(tm)))});let touch;bc.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}},{passive:true});bc.addEventListener('touchend',e=>{if(!touch)return;let p=e.changedTouches[0],dx=p.clientX-touch.x,dy=p.clientY-touch.y,dt=Date.now()-touch.t;if(Math.abs(dx)<18&&Math.abs(dy)<18)rotate();else if(Math.abs(dx)>Math.abs(dy))act(dx>0?'right':'left');else if(dy>55&&dt<220)drop();else act('down');touch=null},{passive:true});grid=Array.from({length:R},()=>Array(C).fill(''));next=type();drawNext();new ResizeObserver(resize).observe(bc);window.addEventListener('resize',resize);resize()})();</script></body></html>
