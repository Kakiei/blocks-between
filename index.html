<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>方块之间 · 俄罗斯方块</title>
  <style>
    :root{color-scheme:dark;--bg:#10131d;--panel:#191e2c;--line:#ffffff16;--text:#f3f5ff;--muted:#8991a8;--accent:#a6f05b;--cyan:#66e5dc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#28304a 0%,var(--bg) 54%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;padding:24px 16px;user-select:none;-webkit-user-select:none}
    button{font:inherit;color:inherit}.app{width:min(100%,920px)}header{display:flex;justify-content:space-between;align-items:center;margin:0 auto 22px;max-width:700px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;border:1px solid #ffffff1c;border-radius:12px;background:#ffffff08}.logo i{background:var(--accent);border-radius:2px}.logo i:nth-child(2),.logo i:nth-child(3),.logo i:nth-child(5){opacity:.3}.brand h1{font-size:17px;letter-spacing:.12em;margin:0;font-weight:750}.brand p{font-size:11px;color:var(--muted);margin:4px 0 0;letter-spacing:.08em}.header-actions{display:flex;gap:8px}.icon-btn,.secondary{border:1px solid var(--line);background:#ffffff08;border-radius:12px;cursor:pointer;transition:.15s}.icon-btn{width:42px;height:42px;font-size:18px}.icon-btn:hover,.secondary:hover{background:#ffffff14;transform:translateY(-1px)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px;max-width:700px;margin:auto}.board-shell{position:relative;width:min(100%,calc(min(74vh,680px)/2 + 22px));justify-self:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#ffffff0c,#ffffff03);box-shadow:0 24px 80px #0005}.board-wrap{position:relative;width:100%;aspect-ratio:1/2;max-height:min(74vh,680px);margin:auto}.board-wrap canvas{display:block;width:100%;height:100%;border-radius:10px;background:#111621}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#10131dcc;border-radius:10px;text-align:center;padding:24px}.overlay.hidden{display:none}.overlay-card h2{font-size:25px;margin:0 0 8px}.overlay-card p{color:#a7aec2;font-size:13px;line-height:1.7;margin:0 0 20px}.primary{background:var(--accent);color:#17200e;border:0;border-radius:12px;padding:12px 24px;font-weight:750;cursor:pointer;box-shadow:0 5px 20px #a6f05b30}.primary:active{transform:scale(.97)}
    .side{display:flex;flex-direction:column;gap:12px}.card{background:linear-gradient(145deg,#1c2231,#171b27);border:1px solid var(--line);border-radius:16px;padding:15px}.label{font-size:10px;color:var(--muted);letter-spacing:.14em;font-weight:700}.score{font-size:29px;line-height:1.2;font-weight:750;font-variant-numeric:tabular-nums;margin-top:7px}.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat-small{font-size:18px;font-weight:700;margin-top:4px}.preview{height:80px;display:flex;align-items:center;justify-content:center;margin-top:6px}.preview canvas{width:104px;height:72px}.progress{height:4px;background:#ffffff12;border-radius:8px;margin-top:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.secondary{width:100%;padding:11px;font-size:12px;font-weight:650}.hint{font-size:11px;color:var(--muted);line-height:1.7;padding:2px 3px}.hint strong{color:#c4cad9;font-weight:600}.mobile-controls{display:none}.difficulty-card{padding:11px 14px}.difficulty-card label{display:block;margin-bottom:7px}.difficulty-select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#111621;color:var(--text);font:inherit;font-size:12px;outline:none}.difficulty-select:disabled{opacity:.65}
    @media(max-width:600px){body{align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}.app{width:min(100%,440px)}header{margin-bottom:12px}.brand h1{font-size:15px}.brand p{font-size:10px}.logo{width:38px;height:38px}.layout{grid-template-columns:minmax(0,1fr) 98px;gap:8px}.board-shell{width:min(100%,calc(62vh / 1.85 + 14px));padding:6px;border-radius:14px}.board-wrap{max-height:62vh;aspect-ratio:1/1.85}.side{gap:7px}.card{padding:10px;border-radius:12px}.label{font-size:9px;letter-spacing:.08em}.score{font-size:19px;margin-top:5px}.stats-row{display:flex;flex-direction:column;gap:8px;margin-top:10px}.stat-small{font-size:15px}.preview{height:49px;margin-top:2px}.preview canvas{width:75px;height:48px}.secondary{padding:9px 3px;font-size:10px;border-radius:10px}.hint{display:none}.difficulty-card{padding:8px}.difficulty-select{padding:7px 5px;font-size:10px}.mobile-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:440px;margin:12px auto 0;touch-action:none}.control{height:52px;border:1px solid var(--line);border-radius:14px;background:#ffffff0b;font-size:20px;font-weight:700;touch-action:none}.control.drop{background:#a6f05b;color:#17200e;border:0}.control:active{background:#ffffff20;transform:scale(.96)}.mobile-controls .wide{font-size:12px}.board-wrap{touch-action:none}}
    @media(max-width:360px){.layout{grid-template-columns:minmax(0,1fr) 84px}.score{font-size:16px}.board-wrap{max-height:58vh}.control{height:46px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div><h1>方块之间</h1><p>给思绪一点落点</p></div></div><div class="header-actions"><button class="icon-btn" id="soundBtn" aria-label="切换音效" title="音效">♫</button><button class="icon-btn" id="pauseBtn" aria-label="暂停" title="暂停">Ⅱ</button></div></header>
  <section class="layout" aria-label="俄罗斯方块游戏">
    <div class="board-shell"><div class="board-wrap"><canvas id="board" aria-label="游戏区域"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">让方块落在恰好的位置。<br>消除整行，继续前进。</p><button class="primary" id="startBtn">开始游戏</button></div></div></div></div>
    <aside class="side"><div class="card"><div class="label">得分</div><div class="score" id="score">000000</div><div class="stats-row"><div><div class="label">关卡</div><div class="stat-small" id="level">01</div></div><div><div class="label">消除行</div><div class="stat-small" id="lines">00</div></div></div><div class="label" id="progressLabel" style="margin-top:12px">升级进度</div><div class="progress"><i id="progress"></i></div></div><div class="card difficulty-card"><label class="label" for="difficulty">选择难度</label><select class="difficulty-select" id="difficulty"><option value="easy">轻松</option><option value="normal">标准</option><option value="hard">挑战</option></select></div><div class="card"><div class="label">下一个</div><div class="preview"><canvas id="next"></canvas></div></div><button class="secondary" id="restartBtn">↻　重新开始</button><div class="hint"><strong>键盘操作</strong><br>← → 移动　↑ 旋转<br>↓ 加速　空格 硬降<br>P 暂停</div></aside>
  </section>
  <nav class="mobile-controls" aria-label="触屏控制"><button class="control" data-action="left" aria-label="向左">←</button><button class="control" data-action="rotate" aria-label="旋转">↻</button><button class="control" data-action="right" aria-label="向右">→</button><button class="control" data-action="down" aria-label="软降">↓</button><button class="control drop" data-action="drop" aria-label="直接落下">⬇</button></nav>
</main>
<script>
(()=>{
const COLS=10,ROWS=20, COLORS={I:'#63d9e8',O:'#f6d365',T:'#b49aff',S:'#8be28d',Z:'#ff7e91',J:'#7298ff',L:'#ffad68'},DIFFICULTIES={easy:{speed:950,goal:8},normal:{speed:750,goal:10},hard:{speed:560,goal:12}};
const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const boardCanvas=document.querySelector('#board'),ctx=boardCanvas.getContext('2d'),nextCanvas=document.querySelector('#next'),nctx=nextCanvas.getContext('2d');
let grid,piece,nextType,score,lines,level,difficulty=localStorage.getItem('blocks-difficulty')||'normal',running=false,paused=false,raf,last=0,dropTimer=0,sound=true,audioCtx, best=Number(localStorage.getItem('blocks-best')||0);
const $=s=>document.querySelector(s);
function resize(){let d=Math.min(devicePixelRatio||1,2),r=boardCanvas.getBoundingClientRect();boardCanvas.width=Math.round(r.width*d);boardCanvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);draw();drawNext()}
function newPiece(type){let m=SHAPES[type].map(r=>r.slice());return{type,m,x:Math.floor((COLS-m[0].length)/2),y:0}}
function randomType(){return Object.keys(SHAPES)[Math.floor(Math.random()*7)]}
function start(){difficulty=DIFFICULTIES[difficulty]?difficulty:'normal';grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));score=0;lines=0;level=1;nextType=randomType();piece=newPiece(randomType());running=true;paused=false;dropTimer=0;last=0;$('#overlay').classList.add('hidden');$('#pauseBtn').textContent='Ⅱ';$('#difficulty').disabled=true;updateUI();drawNext();beep(520,.07);if(collides(piece)){end()}else{cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}}
function collides(p){for(let y=0;y<p.m.length;y++)for(let x=0;x<p.m[y].length;x++)if(p.m[y][x]){let nx=p.x+x,ny=p.y+y;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&grid[ny][nx]))return true}return false}
function merge(){piece.m.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}));let remaining=grid.filter(row=>!row.every(Boolean)),cleared=ROWS-remaining.length;if(cleared){grid=Array.from({length:cleared},()=>Array(COLS).fill(null)).concat(remaining);let previousLevel=level;lines+=cleared;score+=[0,100,300,500,800][cleared]*level;level=Math.floor(lines/DIFFICULTIES[difficulty].goal)+1;scoreSound(cleared);if(level>previousLevel){stageSound();$('#overlayTitle').textContent=`第 ${level-1} 关完成！`;$('#overlayText').textContent=`进入第 ${level} 关，方块下落会更快。`;$('#startBtn').textContent='继续闯关';$('#overlay').classList.remove('hidden');paused=true;$('#pauseBtn').textContent='▶'}}piece=newPiece(nextType);nextType=randomType();drawNext();updateUI();if(collides(piece))end()}
function move(dx,dy){if(!running||paused)return false;let p={...piece,x:piece.x+dx,y:piece.y+dy};if(!collides(p)){piece=p;draw();if(dx)beep(310,.025);else if(dy)beep(360,.018);return true}if(dy>0)merge();return false}
function rotate(){if(!running||paused)return;let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse()),p={...piece,m};for(const k of [0,-1,1,-2,2]){let q={...p,x:p.x+k};if(!collides(q)){piece=q;draw();beep(260,.035);return}}}
function hardDrop(){if(!running||paused)return;let n=0;while(!collides({...piece,y:piece.y+1})){piece.y++;n++}score+=n*2;merge();beep(180,.07);updateUI();draw()}
function action(a){if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='down'){if(move(0,1)){score++;updateUI()}}if(a==='rotate')rotate();if(a==='drop')hardDrop()}
function loop(t){if(!running||paused)return;let dt=t-last;last=t;dropTimer+=dt;if(dropTimer>Math.max(90,DIFFICULTIES[difficulty].speed-(level-1)*55)){dropTimer=0;move(0,1)}draw();raf=requestAnimationFrame(loop)}
function drawCell(c,x,y,s,ghost=false){let pad=Math.max(1.5,s*.055);if(ghost){c+="75";ctx.fillStyle=c;ctx.fillRect(x*s+pad,y*s+pad,s-pad*2,s-pad*2);ctx.strokeStyle=c;ctx.lineWidth=1;ctx.strokeRect(x*s+pad,y*s+pad,s-pad*2,s-pad*2);return}ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x*s+pad,y*s+pad,s-pad*2,s-pad*2,Math.max(2,s*.15));ctx.fill();ctx.fillStyle='#ffffff32';ctx.fillRect(x*s+pad*2,y*s+pad*2,s-pad*4,Math.max(1,s*.07));ctx.strokeStyle='#ffffff20';ctx.lineWidth=1;ctx.stroke()}
function draw(){if(!ctx||!boardCanvas.width)return;let w=boardCanvas.clientWidth,h=boardCanvas.clientHeight,s=Math.min(w/COLS,h/ROWS);ctx.clearRect(0,0,w,h);ctx.fillStyle='#111621';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*s,0);ctx.lineTo(x*s,ROWS*s);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*s);ctx.lineTo(COLS*s,y*s);ctx.stroke()}if(grid)grid.forEach((row,y)=>row.forEach((v,x)=>v&&drawCell(COLORS[v],x,y,s)));if(piece){let gy=piece.y;while(!collides({...piece,y:gy+1}))gy++;piece.m.forEach((row,y)=>row.forEach((v,x)=>{if(v){drawCell(COLORS[piece.type],piece.x+x,gy+y,s,true);drawCell(COLORS[piece.type],piece.x+x,piece.y+y,s)}}))}}
function drawNext(){if(!nctx)return;let d=Math.min(devicePixelRatio||1,2),r=nextCanvas.getBoundingClientRect();nextCanvas.width=r.width*d;nextCanvas.height=r.height*d;nctx.setTransform(d,0,0,d,0,0);nctx.clearRect(0,0,r.width,r.height);if(!nextType)return;let m=SHAPES[nextType],s=Math.min(21,r.width/(m[0].length+1),r.height/(m.length+1)),ox=(r.width-m[0].length*s)/2,oy=(r.height-m.length*s)/2;nctx.fillStyle=COLORS[nextType];m.forEach((row,y)=>row.forEach((v,x)=>{if(v){nctx.beginPath();nctx.roundRect(ox+x*s+1,oy+y*s+1,s-2,s-2,3);nctx.fill()}}))}
function updateUI(){$('#score').textContent=String(score||0).padStart(6,'0');$('#level').textContent=String(level||1).padStart(2,'0');$('#lines').textContent=String(lines||0).padStart(2,'0');let goal=DIFFICULTIES[difficulty].goal;$('#progress').style.width=`${(lines%goal)/goal*100}%`;$('#progressLabel').textContent=`升级进度 · ${lines%goal}/${goal} 行`}
function end(){running=false;paused=false;$('#difficulty').disabled=false;$('#pauseBtn').textContent='Ⅱ';beep(140,.2);$('#overlay').classList.remove('hidden');$('#overlayTitle').textContent='这局很精彩';$('#overlayText').innerHTML=`闯到第 ${level} 关 · 得分 ${String(score).padStart(6,'0')}<br>${score>best?'新纪录，恭喜！':'再来一局，刷新纪录吧。'}`;$('#startBtn').textContent='再玩一次';if(score>best){best=score;localStorage.setItem('blocks-best',best)}}
function togglePause(){if(!running)return;paused=!paused;$('#pauseBtn').textContent=paused?'▶':'Ⅱ';beep(paused?220:420,.06);if(paused){$('#overlay').classList.remove('hidden');$('#overlayTitle').textContent='休息一下';$('#overlayText').textContent='准备好了就继续。';$('#startBtn').textContent='继续游戏'}else{$('#overlay').classList.add('hidden');last=0;raf=requestAnimationFrame(loop)}}
function tone(freq,dur,delay=0,volume=.045){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});let t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(55,freq*.82),t+dur);filter.type='lowpass';filter.frequency.value=3200;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(volume,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(filter);filter.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.01)}catch{}}
function beep(freq,dur){tone(freq,dur,0,.035)}
function scoreSound(rows){let notes=rows===1?[[660,.09],[880,.13]]:rows===2?[[660,.08],[784,.08],[988,.15]]:rows===3?[[587,.08],[740,.08],[880,.08],[1175,.18]]:[[523,.08],[659,.08],[784,.08],[988,.08],[1318,.22]];let at=0;notes.forEach(([f,d])=>{tone(f,d,at,.052);at+=d*.78})}
function stageSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,i*.09,.055))}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')action('left');else if(e.key==='ArrowRight'||e.key==='d')action('right');else if(e.key==='ArrowDown'||e.key==='s')action('down');else if(e.key==='ArrowUp'||e.key==='w')action('rotate');else if(e.key===' ')hardDrop();else if(e.key.toLowerCase()==='p'||e.key==='Escape')togglePause();else if(e.key==='Enter'&&!running)start()});
$('#difficulty').value=DIFFICULTIES[difficulty]?difficulty:'normal';$('#difficulty').onchange=e=>{difficulty=e.target.value;localStorage.setItem('blocks-difficulty',difficulty);updateUI()};$('#startBtn').onclick=()=>{if(paused){paused=false;$('#overlay').classList.add('hidden');$('#pauseBtn').textContent='Ⅱ';last=0;raf=requestAnimationFrame(loop);return}start()};$('#restartBtn').onclick=start;$('#pauseBtn').onclick=togglePause;$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').style.opacity=sound?'1':'.45';if(sound)beep(660,.12)};
document.querySelectorAll('.control').forEach(b=>{const a=b.dataset.action;let timer;const fire=()=>action(a);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);fire();if(a==='left'||a==='right'||a==='down')timer=setInterval(fire,135)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(timer)))});
let touchStart=null;boardCanvas.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}},{passive:true});boardCanvas.addEventListener('touchend',e=>{if(!touchStart)return;let t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y,dt=Date.now()-touchStart.t;if(Math.abs(dx)<18&&Math.abs(dy)<18){rotate()}else if(Math.abs(dx)>Math.abs(dy))action(dx>0?'right':'left');else if(dy>55&&dt<220)hardDrop();else action('down');touchStart=null},{passive:true});
grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));nextType=randomType();piece=null;updateUI();drawNext();new ResizeObserver(resize).observe(boardCanvas);window.addEventListener('resize',resize);resize();
})();
</script>
</body>
</html>
